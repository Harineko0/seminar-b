[project]
name = "tinyproto-research"
version = "0.1.0"
description = "Researching AI Coding Agents with Symbolic Execution and PBT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hypothesis>=6.150.0",
    "pytest>=9.0.0",
    "crosshair-tool>=0.0.101",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test.py", "pbt.py"]

[tool.uv]
managed = true
